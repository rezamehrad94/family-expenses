<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e1113;--card:#161b1e;--card2:#1c2226;--line:#262d31;--tx:#eef4f1;--mut:#8b9791;--ac:#78c8af;--red:#ef6b5b;--green:#66bb6a;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;padding:14px 14px calc(30px + env(safe-area-inset-bottom));max-width:620px;margin-inline:auto;line-height:1.55}

.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.mut{color:var(--mut);font-size:12px}.small{font-size:12px}
.pos{color:var(--green)}.neg{color:var(--red)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#78c8af,#3f8f74);display:grid;place-items:center;color:#08211a;font-weight:900}
.title{font-size:17px;font-weight:900}

.amount.pos{color:var(--green)}.amount.neg{color:var(--red)}

.chip.on{background:var(--ac);border-color:var(--ac);color:#08211a;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tile:active{transform:scale(.98)}
.tile .e{font-size:24px}.tile b{display:block;margin:5px 0 2px;font-size:14px}
.tile small{color:var(--mut)}
.bar{height:7px;background:var(--line);border-radius:99px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}

.tx:first-child{border-top:0}
.tx .info{flex:1;min-width:0}
.tx .info small{display:block;color:var(--mut);font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-weight:800;white-space:nowrap}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconbtn{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:12px}
.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet .box{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.handle{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.hidden{display:none!important}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ac);color:#08211a;font-weight:800;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:80}

</section>

<label>دسته</label><select id="quickCategory"></select><label>مورد</label><select id="quickItem"></select>
<label>مبلغ (تومان)</label><input id="quickAmount" inputmode="numeric"><label>توضیح</label><input id="quickNote">

<label>عنوان برنامه</label><input id="titleInput" placeholder="خرج‌های خانواده">
<label>تم</label><div class="chips" id="themeChips"><button class="chip" data-theme="graphite">🖤 زغالی</button><button class="chip" data-theme="forest">🌿 جنگلی</button><button class="chip" data-theme="midnight">🌙 نیمه‌شب</button></div>

<div id="dialog" class="sheet hidden"><div class="box"><div class="handle"></div><p id="dialogText" style="white-space:pre-wrap"></p><input id="dialogInput" class="hidden"><div class="row" style="margin-top:14px"><button class="p" id="dialogOk">تایید</button><button id="dialogCancel">انصراف</button></div></div></div>

<script>
const $=s=>document.querySelector(s),fa=n=>Number(n||0).toLocaleString("fa-IR"),en=s=>String(s||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d]/g,""),esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MN=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const today=dt=>{const p=new Intl.DateTimeFormat("en-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",day:"numeric"}).formatToParts(dt||new Date()),g=t=>+p.find(x=>x.type===t).value;return{y:g("year"),m:g("month"),d:g("day")}};
const todayLabel=()=>new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());
const periodKey=t=>t.d>=25?t.y*100+t.m:(t.m===1?(t.y-1)*100+12:t.y*100+t.m-1),dateNum=t=>t.y*10000+t.m*100+t.d,sum=a=>a.reduce((s,t)=>s+(+t.amount||0),0);
const cache=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const defaultCategories=()=>[{id:"home",icon:"🏢",name:"ساختمان",items:[{name:"قبض آب",monthly:1},{name:"قبض برق",monthly:1},{name:"قبض گاز",monthly:1},{name:"برق مشترک",monthly:1},{name:"آب مشترک",monthly:1},{name:"شارژ ساختمان",monthly:1},{name:"تعمیرات"}]},{id:"food",icon:"🍽️",name:"خوراک",items:[{name:"گوشت و مرغ"},{name:"نان"},{name:"قهوه"},{name:"سوپرمارکت"},{name:"میوه و سبزی"},{name:"لبنیات"},{name:"سایر خوراکی"}]},{id:"reza",icon:"👨",name:"رضا",items:[{name:"اینترنت",monthly:1},{name:"آرایشگاه",monthly:1},{name:"باشگاه",monthly:1},{name:"لباس"},{name:"وسایل مردانه"}]},{id:"mina",icon:"👩",name:"مینا",items:[{name:"ناخن",monthly:1},{name:"آرایشگاه و مو",monthly:1},{name:"لباس زنانه"},{name:"لوازم آرایشی و بهداشتی"},{name:"وسایل زنانه"}]},{id:"mehrad",icon:"👶",name:"مهراد",items:[{name:"مهد / آموزش",monthly:1},{name:"لباس بچگانه"},{name:"اسباب‌بازی"},{name:"پوشک و بهداشت"},{name:"دارو و دکتر"}]},{id:"car",icon:"🚗",name:"ماشین",items:[{name:"بنزین"},{name:"تعمیر و سرویس"},{name:"لوازم یدکی"},{name:"بیمه"},{name:"عوارض و پارکینگ"}]},{id:"loans",icon:"💳",name:"اقساط",items:[{name:"قسط بانک صادرات",monthly:1,installments:0,paid:0},{name:"قسط بانک گردشگری",monthly:1,installments:0,paid:0},{name:"قسط بانک شهر",monthly:1,installments:0,paid:0},{name:"قسط مامان اعظم",monthly:1,installments:0,paid:0},{name:"سایر"}]},{id:"other",icon:"📦",name:"سایر",items:[{name:"تفریح و رستوران"},{name:"هدیه"},{name:"سفر"},{name:"متفرقه"}]},{id:"income",icon:"💵",name:"درآمد",items:[{name:"حقوق دریافتی",monthly:1},{name:"کارانه",monthly:1},{name:"معیشت",monthly:1},{name:"یارانه",monthly:1},{name:"اعیاد"},{name:"سایر درآمد"}]}];
let categories=load("fx_categories")||defaultCategories(),transactions=load("fx_transactions")||[],pending=load("fx_pending")||[],settings=load("fx_settings")||{title:"خرج‌های خانواده",theme:"graphite",accent:"#78c8af"},kala=load("fx_kala")||{on:true,at:0},goal=load("fx_goal")||0,current=periodKey(today()),view=null,editing=false,editId=null,receiptData=null,store=null;
function applyTheme(){const r=document.documentElement;r.dataset.theme=settings.theme;r.style.setProperty("--ac",settings.accent||"#78c8af");$("#appTitle").textContent=settings.title||"خرج‌های خانواده"}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function dialog(text,value,mode){return new Promise(res=>{$("#dialogText").textContent=text;const i=$("#dialogInput");i.hidden=mode!=="input";i.value=value==null?"":value;$("#dialogCancel").hidden=mode==="alert";$("#dialog").classList.remove("hidden");if(mode==="input"){i.focus();i.select()}const done=v=>{$("#dialog").classList.add("hidden");res(v)};$("#dialogOk").onclick=()=>done(mode==="input"?i.value:true);$("#dialogCancel").onclick=()=>done(mode==="input"?null:false)})}
const ask=(t,v)=>dialog(t,v,"input"),confirm=t=>dialog(t,null,"confirm"),alert=t=>dialog(t,null,"alert");
let undoTimer;function undoBar(text,fn){clearTimeout(undoTimer);$("#undoText").textContent=text;$("#undo").classList.remove("hidden");$("#undoBtn").onclick=async()=>{$("#undo").classList.add("hidden");clearTimeout(undoTimer);try{await fn();toast("برگردانده شد")}catch(e){alert("برگرداندن انجام نشد")}};undoTimer=setTimeout(()=>$("#undo").classList.add("hidden"),8000)}
function setSync(){const online=navigator.onLine,p=pending.length;$("#syncState").textContent=!online?(p?`آفلاین · ${fa(p)} ثبت در انتظار همگام‌سازی`:"آفلاین · داده‌ها روی دستگاه ذخیره می‌شوند"):(p?`${fa(p)} ثبت در انتظار همگام‌سازی`:"ذخیره روی دستگاه · آماده");$("#syncState").classList.toggle("offline",!online||!!p)}
async function init(){applyTheme();try{store=await claude.use("db")}catch(e){}setSync();render();if("serviceWorker"in navigator)try{await navigator.serviceWorker.register("./sw.js")}catch(e){}syncPending()}
async function saveTransaction(data){
if(editId){const old=transactions.find(t=>t.id===editId),updated={...old,...data};transactions=transactions.map(t=>t.id===editId?updated:t);cache("fx_transactions",transactions);if(store&&navigator.onLine)try{await store.collection("tx").doc(editId).set(updated)}catch(e){queue("update",updated)}else queue("update",updated);undoBar("ویرایش شد",async()=>{transactions=transactions.map(t=>t.id===editId?old:t);cache("fx_transactions",transactions);if(store&&navigator.onLine)try{await store.collection("tx").doc(editId).set(old)}catch(e){};render()})}
else{const o={...data,id:"l"+Date.now()+Math.random().toString(36).slice(2,6)};transactions.push(o);cache("fx_transactions",transactions);if(store&&navigator.onLine)try{await store.collection("tx").add(o)}catch(e){queue("add",o)}else queue("add",o)}
setSync();render()}
function queue(action,data){pending.push({action,data,at:Date.now()});cache("fx_pending",pending);setSync()}
async function deleteTransaction(id){const t=transactions.find(x=>x.id===id);if(!t)return;transactions=transactions.filter(x=>x.id!==id);cache("fx_transactions",transactions);if(store&&navigator.onLine)try{await store.collection("tx").doc(id).delete()}catch(e){queue("delete",{id})}else queue("delete",{id});const{id,...old}=t;undoBar("حذف شد",async()=>{transactions.push({...old,id});cache("fx_transactions",transactions);if(store&&navigator.onLine)try{await store.collection("tx").add(old)}catch(e){};render()});setSync();render()}
async function saveCategories(){cache("fx_categories",categories);if(store&&navigator.onLine)try{await store.doc("config/main").set({groups:categories})}catch(e){};render()}
async function saveGoal(v){goal=v;cache("fx_goal",v);if(store&&navigator.onLine)try{await store.doc("config/goal").set({amount:v})}catch(e){};render()}
async function saveKala(){cache("fx_kala",kala);if(store&&navigator.onLine)try{await store.doc("config/kala").set(kala)}catch(e){};render()}
async function syncPending(){if(!store||!navigator.onLine||!pending.length)return setSync();const rest=[];for(const p of pending){try{if(p.action==="add")await store.collection("tx").add(p.data);else if(p.action==="update")await store.collection("tx").doc(p.data.id).set(p.data);else if(p.action==="delete")await store.collection("tx").doc(p.data.id).delete()}catch(e){rest.push(p)}}pending=rest;cache("fx_pending",pending);setSync();if(!rest.length)toast("همگام‌سازی انجام شد")}
window.addEventListener("online",syncPending);window.addEventListener("offline",setSync);
function txRow(t,showCategory){const c=categories.find(x=>x.id===t.category);return `<div class="tx"><div class="info"><b>${esc(t.item||c?.name||"سایر")}${showCategory&&c?` <span class="mut">${esc(c.icon+" "+c.name)}</span>`:""}</b><small>${fa(t.day)} ${MN[t.month-1]} ${fa(t.year)} · ${esc(t.person||"")}${t.note?" · "+esc(t.note):""}${t.receipt?` · <span data-img="${t.id}" style="cursor:pointer">📎 رسید</span>`:""}</small></div><div class="amt ${t.category==="income"?"pos":""}">${t.category==="income"?"+":""}${fa(t.amount)}</div><button class="iconbtn" data-edit="${t.id}">✏️</button><button class="iconbtn d" data-delete="${t.id}">✕</button></div>`}
function render(){const inPeriod=transactions.filter(t=>periodKey(t)===current),income=sum(inPeriod.filter(t=>t.category==="income")),expense=sum(inPeriod.filter(t=>t.category!=="income")),net=income-expense,prev=periodKey({y:Math.floor(current/100),m:current%100,d:1})-1,prevTx=transactions.filter(t=>periodKey(t)===prev),prevNet=sum(prevTx.filter(t=>t.category==="income"))-sum(prevTx.filter(t=>t.category!=="income")),nm=current%100===12?1:current%100+1;
$("#periodTitle").textContent=`${fa(25)} ${MN[current%100-1]} تا ${fa(24)} ${MN[nm-1]} ${fa(current%100===12?Math.floor(current/100)+1:Math.floor(current/100))}`;
$("#summary").innerHTML=`<div class="small mut">تراز این دوره</div><div class="amount ${net<0?"neg":"pos"}">${net<0?"−":"+"}${fa(Math.abs(net))} تومان</div><div class="small mut">درآمد ${fa(income)} · هزینه ${fa(expense)}</div>`;
