<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4f1;--card:#fff;--tx:#222;--mut:#777;--ac:#e8832e;--bd:#e6e1da;--red:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--card:#262524;--tx:#eee;--mut:#a09b94;--bd:#3a3836;--ac:#f09a4d;--red:#ef6b5b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a19;--card:#262524;--tx:#eee;--mut:#a09b94;--bd:#3a3836;--ac:#f09a4d;--red:#ef6b5b;color-scheme:dark}
:root[data-t="lux"][data-t]{--bg:#111010;--card:#1b1918;--tx:#f1ebe3;--mut:#a39a8f;--ac:#d19a52;--bd:#332d29;--red:#e5604f;--hd:linear-gradient(135deg,#4a1616,#1b1918 62%);color-scheme:dark}
:root[data-t="ruby"][data-t]{--bg:#0b0b0c;--card:#17171a;--tx:#f4f1ee;--mut:#9b96a0;--ac:#e0443a;--bd:#2c2a30;--red:#ff7a6b;--hd:linear-gradient(135deg,#7a1212,#17171a 65%);color-scheme:dark}
:root[data-t="light"][data-t]{--bg:#f6f4f1;--card:#fff;--tx:#222;--mut:#777;--ac:#e8832e;--bd:#e6e1da;--red:#c0392b;--hd:linear-gradient(135deg,#fbe6d0,#fff 65%);color-scheme:light}
.card{box-shadow:0 2px 14px #0003;border-radius:18px}.card:has(#nx){background:var(--hd);border-color:var(--ac)}
.tile{background:linear-gradient(160deg,var(--card),var(--bg));box-shadow:0 2px 10px #0003;transition:.15s}.tile:active{transform:scale(.96)}.tile .e{filter:drop-shadow(0 2px 4px #0006)}
.kon,.koff{color:#fff!important;font-weight:700}.kon{background:#3aa655;border-color:#3aa655}.koff{background:var(--red);border-color:var(--red)}
.off{display:none!important}.grid.c3{grid-template-columns:1fr 1fr 1fr}
.mvb{display:flex;justify-content:center;gap:10px;margin-bottom:4px}.mvb i{font-style:normal;padding:2px 10px;border:1px solid var(--bd);border-radius:8px}.ir{flex-wrap:wrap}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;padding:12px 12px 40px;max-width:640px;margin-inline:auto}

button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}

button.d{color:var(--red)}

.tx small,.ir small{display:block}
.a{white-space:nowrap;font-weight:600}
.ir{cursor:pointer}.ir button{padding:5px 9px}
.bd{font-size:11px;background:var(--ac);color:#fff;border-radius:8px;padding:1px 7px;margin-inline-start:4px}

input,select{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:6px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}

:root{--grn:#2e7d32}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grn:#66bb6a}}
:root[data-theme="dark"]{--grn:#66bb6a}
.pos{color:var(--grn)}.neg{color:var(--red)}
.srow{display:flex;justify-content:space-between;margin:6px 0;font-size:15px}
.net{font-size:22px;font-weight:700;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.tile.inc{border-color:var(--grn);margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px}
.tile.inc .e{font-size:28px}.tile.inc b{margin:0}
.pb{height:7px;background:var(--bd);border-radius:5px;margin-top:4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.cols{display:flex;gap:6px;margin:8px 0}.cols>div{flex:1;text-align:center}.cb{height:90px;display:flex;align-items:flex-end;gap:2px;justify-content:center}.cb i{width:42%;border-radius:3px 3px 0 0;min-height:1px}
#ov{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:30}#ov img{max-width:95%;max-height:90%;border-radius:8px}
#dlg,#set{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}.dbox{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px}.dbox p{margin:0 0 10px;white-space:pre-wrap}
#ut{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:12px;margin:auto;max-width:420px;background:#333;color:#fff;border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:35}#ut button{background:var(--ac);color:#fff;border:0}

#ts.show{opacity:1}

    <p class="mut" id="eh2" hidden>⏰ ماهانه · 💲 مبلغ ثابت · 📆 تعداد اقساط<br><button id="bd" style="margin-top:6px">🎯 بودجهٔ ماهانهٔ این دسته</button></p>
  </div>

<div id="set" hidden><div class="dbox" style="max-height:88vh;overflow:auto"><b>⚙️ تنظیمات ظاهر</b><label>عنوان برنامه</label><input id="sti" placeholder="💰 خرج‌های خانواده"><label>تم</label><div class="row" id="sth"><button data-th="lux">🖤 لوکس</button><button data-th="ruby">❤️ روبی</button><button data-th="light">☀️ روشن</button></div><label>رنگ تاکیدی</label><div class="row"><input type="color" id="sac" style="height:44px"><button id="sacr" style="flex:0 0 auto">رنگ پیش‌فرض تم</button></div><label>ستون‌های دسته‌ها</label><div class="row" id="scl"><button data-c="2">۲ ستون</button><button data-c="3">۳ ستون</button></div><label>بخش‌های صفحهٔ اول (لمس = نمایش یا پنهان)</label><div class="chips" id="ssec"></div><button class="p" id="sok" style="width:100%;margin-top:14px">ذخیره و بستن</button></div></div>

<script>
const MN=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const r=(n,rec,amt,tot,pre)=>({n,rec:!!rec,amt:amt||0,tot:tot||0,pre:pre||0});
const DEF=[
{id:"home",n:"🏢 ساختمان",i:[r("قبض آب",1),r("قبض برق",1),r("قبض گاز",1),r("برق مشترک ساختمان",1),r("آب مشترک ساختمان",1),r("شارژ ساختمان",1),r("تعمیرات")]},
{id:"food",n:"🍽️ خوراک",i:[r("گوشت و مرغ"),r("نان"),r("قهوه"),r("سوپرمارکت"),r("میوه و سبزی"),r("لبنیات"),r("سایر خوراکی")]},
{id:"reza",n:"👨 رضا",i:[r("اینترنت",1),r("آرایشگاه",1),r("باشگاه",1),r("لباس"),r("وسایل مردانه")]},
{id:"mina",n:"👩 مینا",i:[r("ناخن",1),r("آرایشگاه و مو",1),r("لباس زنانه"),r("لوازم آرایش و بهداشتی"),r("وسایل زنانه")]},
{id:"mehrad",n:"👶 مهراد",i:[r("مهد / آموزش",1),r("لباس بچگانه"),r("اسباب‌بازی"),r("پوشک و بهداشت"),r("دارو و دکتر")]},
{id:"car",n:"🚗 ماشین",i:[r("بنزین"),r("تعمیر و سرویس"),r("لوازم یدکی"),r("بیمه"),r("عوارض و پارکینگ")]},
{id:"loans",n:"💳 اقساط",i:[r("قسط بانک صادرات",1),r("قسط بانک گردشگری",1),r("قسط بانک شهر",1),r("قسط مامان اعظم",1),r("سایر")]},
{id:"other",n:"📦 سایر",i:[r("تفریح و رستوران"),r("هدیه"),r("سفر"),r("متفرقه")]},
{id:"income",n:"💵 درآمد",i:[r("حقوق دریافتی",1),r("کارانه",1),r("معیشت",1),r("یارانه",1),r("اعیاد"),r("سایر درآمد")]}];
const LOANS=DEF.find(g=>g.id==="loans"),INC=DEF.find(g=>g.id==="income"),FOOD=DEF.find(g=>g.id==="food"),cp=o=>JSON.parse(JSON.stringify(o));
const fix=(c,L)=>{c=c.map(g=>({...g,i:items(g)}));if(L&&!c.some(g=>g.id==="loans")){const k=c.findIndex(g=>g.id==="car");c.splice(k<0?c.length:k+1,0,cp(LOANS))}
  if(!L)return c;
  const h=c.find(g=>g.id==="home");
  if(h){if(/خانه و ساختمان/.test(h.n))h.n="🏢 ساختمان";
    const k=h.i.findIndex(x=>x.n==="اینترنت");
    if(k>=0){const it=h.i.splice(k,1)[0],z=c.find(g=>g.id==="reza");if(z&&!z.i.some(x=>x.n==="اینترنت"))z.i.unshift(it)}
    const f=h.i.findIndex(x=>x.n==="خوراک و خرید خانه");if(f>=0)h.i.splice(f,1)}
  if(!c.some(g=>g.id==="food"))c.splice(c.findIndex(g=>g.id==="home")+1,0,cp(FOOD));
  let n=c.find(g=>g.id==="income");if(!n){n=cp(INC);c.push(n)}
  n.i=n.i.filter(i=>i.n!=="کالابرگ");if(!n.i.some(i=>i.n==="یارانه"))n.i.splice(3,0,r("یارانه",1));
  return c};
const $=s=>document.querySelector(s);
const P=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const fa=n=>Number(n).toLocaleString("fa-IR");
const en=s=>String(s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d]/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function today(dt){const p=new Intl.DateTimeFormat("en-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",day:"numeric"}).formatToParts(dt||new Date());const g=t=>+p.find(x=>x.type===t).value;return{y:g("year"),m:g("month"),d:g("day")}}
const todayLabel=()=>new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());
const items=g=>g.i.map(x=>typeof x==="string"?r(x):x);
const ge=g=>{const e=g.n.split(" ")[0];return /[\u0600-\u06FFA-Za-z0-9]/.test(e)?["📁",g.n]:[e,g.n.slice(e.length+1)]};
const key=t=>t.d>=25?t.y*100+t.m:(t.m==1?(t.y-1)*100+12:t.y*100+t.m-1), dn=t=>t.y*10000+t.m*100+t.d, sum=a=>a.reduce((s,t)=>s+t.amount,0);
const kc=()=>cur.y*100+cur.m,k0=key(today());
let kala={on:true,at:0},goal=0,qid=null,imgData=null,cfg=DEF,txs=[],cur={y:k0/100|0,m:k0%100},view=null,ed=false,S=null,custom=false,lastSel="";
const inM=k=>txs.filter(t=>key(t)===k);
const toast=s=>{const t=$("#ts");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)};
const dlg=(m,d,mode)=>new Promise(res=>{$("#dm2").textContent=m;const i=$("#di");i.hidden=mode!=="p";i.value=d==null?"":d;$("#dno").hidden=mode==="a";$("#dlg").hidden=false;if(mode==="p"){i.focus();i.select()}const done=v=>{$("#dlg").hidden=true;res(v)};$("#dok").onclick=()=>done(mode==="p"?i.value:true);$("#dno").onclick=()=>done(mode==="p"?null:false)});
const ask=(m,d)=>dlg(m,d,"p"),yes=m=>dlg(m,null,"c"),say=m=>dlg(m,null,"a");
let utm;const undoBar=(m,fn)=>{clearTimeout(utm);$("#utx").textContent=m;$("#ut").hidden=false;$("#ub").onclick=async()=>{$("#ut").hidden=true;clearTimeout(utm);try{await fn();toast("↩️ برگردانده شد")}catch(e){say("برگرداندن انجام نشد.")}};utm=setTimeout(()=>$("#ut").hidden=true,8000)};
const cache=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---- storage: shared db when available, else this device only ---- */
async function init(){
  let db=null;
  try{db=await claude.use("db")}catch(e){}
  if(db){
    try{txs=JSON.parse(localStorage.getItem("txc"))||[];cfg=fix(JSON.parse(localStorage.getItem("cfgc"))||DEF)}catch(e){}
    S={add:o=>db.collection("tx").add(o),upd:(id,o)=>db.collection("tx").doc(id).set(o),goalSet:a=>db.doc("config/goal").set({amt:a}),kalaSet:o=>db.doc("config/kala").set(o),del:id=>db.collection("tx").doc(id).delete(),setCfg:c=>db.doc("config/main").set({groups:c,l:2})};
    db.doc("config/main").onSnapshot(s=>{const d=s.exists&&s.data();if(d&&d.groups){cfg=fix(d.groups,!(d.l>=2));if(!(d.l>=2))S.setCfg(cfg).catch(()=>{});cache("cfgc",cfg);draw()}});
    db.doc("config/kala").onSnapshot(s=>{if(s.exists)kala={on:!!s.data().on,at:s.data().at||0};draw()});db.doc("config/goal").onSnapshot(s=>{goal=s.exists?(s.data().amt||0):0;draw()});db.collection("tx").onSnapshot(q=>{txs=q.docs.map(d=>({id:d.id,...d.data()}));cache("txc",txs.map(({img,...x})=>x));draw()},e=>{$("#st").textContent="خطا در خواندن اطلاعات"});
    $("#st").textContent="🔄 همگام بین شما و مینا";
  }else{
    const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
    txs=L("tx")||[];goal=L("goal")||0;kala=L("kala")||kala;cfg=fix(L("cfg")||DEF,L("cfg")&&L("cfgl")!==2);
    S={upd:async(id,o)=>{txs=txs.map(t=>t.id===id?{...o,id}:t);cache("tx",txs);draw()},goalSet:async a=>{goal=a;cache("goal",a);draw()},kalaSet:async o=>{kala=o;cache("kala",o);draw()},add:async o=>{o.id="l"+Date.now();txs.push(o);cache("tx",txs);draw()},del:async id=>{txs=txs.filter(t=>t.id!==id);cache("tx",txs);draw()},setCfg:async c=>{cfg=c;cache("cfg",c);cache("cfgl",2);draw()}};
    $("#st").textContent="⚠️ فقط روی همین دستگاه ذخیره می‌شود (برای همگام‌سازی با مینا، در claude.ai وارد شوید)";
  }
  draw();
}

const inst=(g,it)=>{if(!it.tot)return"";const L=txs.filter(t=>t.g===g.id&&t.i===it.n),p=(it.pre||0)+L.length,rm=Math.max(it.tot-p,0);if(!rm)return'<small class="pos">✅ تمام شد</small>';const k=key(today()),paid=L.some(t=>key(t)===k);let y=k/100|0,m=k%100+rm-(paid?0:1);y+=Math.floor((m-1)/12);m=(m-1)%12+1;return `<small>📆 ${P(p)} از ${P(it.tot)} · ${P(rm)} مانده · پایان: ${MN[m-1]} ${P(y)}</small>`};
const byDate=(a,b)=>dn(b)-dn(a)||(b.ts||0)-(a.ts||0);

function draw(){
  if(view&&!cfg.find(g=>g.id===view))view=null;
  const g=view&&cfg.find(x=>x.id===view);
  $("#home").hidden=!!g;$("#cat").hidden=!g;
  const nm=cur.m==12?1:cur.m+1;
  $("#mt").textContent=`${P(25)} ${MN[cur.m-1]} تا ${P(24)} ${MN[nm-1]} ${P(cur.m==12?cur.y+1:cur.y)}`;
  const k=kc(),pr=cur.m==1?(cur.y-1)*100+12:k-1;
  const all=inM(k),old=inM(pr),mt=g?all.filter(t=>t.g===g.id):all,pt=g?old.filter(t=>t.g===g.id):old;
  const sg=n=>n<0?"−":n>0?"+":"",netOf=a=>sum(a.filter(t=>t.g==="income"))-sum(a.filter(t=>t.g!=="income"));
  if(g){const tot=sum(mt),pv=sum(pt),ic=g.id==="income";
    $("#sm").innerHTML=`<div class="net ${ic?"pos":"neg"}" style="border:0;margin:0;padding:0">${ic?"💵 جمع درآمد":"🧾 جمع هزینه"}: ${fa(tot)} تومان</div>${ic?"":bar(tot,g.bud)}`;
    $("#cmp").textContent=pv?`دورهٔ قبل: ${fa(pv)} (${tot>=pv?"+":"−"}${P(Math.round(Math.abs(tot-pv)/pv*100))}٪)`:"";
  }else{const i=sum(all.filter(t=>t.g==="income")),e=sum(all.filter(t=>t.g!=="income")),n=i-e,pn=netOf(old);
    $("#sm").innerHTML=`<div class="srow"><span>💵 درآمد</span><b class="pos">${fa(i)}</b></div><div class="srow"><span>🧾 هزینه</span><b class="neg">${fa(e)}</b></div><div class="net ${n<0?"neg":"pos"}">${n<0?"🔴 منفی":"🟢 مثبت"}: ${sg(n)}${fa(Math.abs(n))} تومان</div>`;
    $("#cmp").textContent=old.length?`دورهٔ قبل: تراز ${sg(pn)}${fa(Math.abs(pn))}`:"";
  }
  g?drawCat(g,mt):(drawHome(all),extras(k));
}

  const[I,E]=A(k),n=I-E,p=Math.max(n,0)/(goal||1)*100;

  const cnt={};txs.forEach(t=>{if(t.g==="income")return;const q=[t.g,t.i||"",t.amount].join("|");cnt[q]=(cnt[q]||0)+1});
  const top=Object.entries(cnt).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const ks=[];let kk=k;for(let j=0;j<6;j++){ks.unshift(kk);kk=kk%100==1?kk-89:kk-1}
  const D=ks.map(A),mx=Math.max(1,...D.flat());
  const by=cfg.filter(g=>g.id!=="income").map(g=>[g,sum(inM(k).filter(t=>t.g===g.id))]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);

}

  if(x=c("[data-iu]")){const[ix,d]=x.dataset.iu.split("|").map(Number),k=cl(),a=k.find(g=>g.id===view).i,j=ix+d;if(a[j]){[a[ix],a[j]]=[a[j],a[ix]];save(k)}return}
  if(c("#gb")){const v=await ask("هدف پس‌انداز ماهانه (تومان). خالی = حذف هدف",goal||"");if(v!==null){try{await S.goalSet(+en(v)||0);toast("✓ ذخیره شد")}catch(e){say("ذخیره هدف انجام نشد؛ احتمالاً اجازهٔ ویرایش ندارید.")}}return}
  if(x=c("[data-qk]")){const[g,i,a]=x.dataset.qk.split("|");if(await yes(`ثبت «${i||"بدون مورد"}» ${fa(a)} تومان برای امروز؟`)){let w="رضا";try{w=localStorage.getItem("who")||w}catch(e){}S.add({g,i,amount:+a,...today(),n:"",b:w,ts:Date.now()});toast("✓ ثبت شد")}return}
  if(x=c("[data-im]")){const t=txs.find(t=>t.id===x.dataset.im);if(t&&t.img){$("#oi").src=t.img;$("#ov").hidden=false}return}
  if(x=c("[data-it]")){const k=cl(),it=k.find(g=>g.id===view).i[+x.dataset.it],t=await ask("تعداد کل اقساط (۰ = حذف):",it.tot||"");if(t!==null){it.tot=+en(t)||0;if(it.tot){const p=await ask("چند قسط قبل از ثبت در این برنامه پرداخت شده؟",it.pre||0);if(p!==null)it.pre=+en(p)||0}save(k)}return}
  if(x=c("[data-ed]")){const t=txs.find(t=>t.id===x.dataset.ed);if(!t)return;openCat(t.g);const g=cfg.find(g=>g.id===t.g);$("#si").value=t.i&&items(g).some(i=>i.n===t.i)?t.i:"__none";selChange();$("#fa").value=fa(t.amount);$("#fn").value=t.n||"";$("#fb").value=t.b||"رضا";$("#dc").click();$("#dd").value=t.d;$("#dm").value=t.m;$("#dy").value=t.y;$("#dsel").onchange();qid=t.id;$("#sv").textContent="ذخیره تغییرات";return}
});
$("#xp").onclick=async()=>{const rows=[["تاریخ","نوع","دسته","مورد","مبلغ","توضیح","ثبت‌کننده"],...[...txs].sort(byDate).map(t=>{const g=cfg.find(x=>x.id===t.g);return[`${t.y}/${t.m}/${t.d}`,t.g==="income"?"درآمد":"هزینه",g?g.n.replace(/^\S+\s/,""):"",t.i||"",t.amount,t.n||"",t.b||""]})];
  const csv="\ufeff"+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n"),tsv=rows.map(r=>r.map(x=>String(x).replace(/\t|\n/g," ")).join("\t")).join("\n");
  try{const f=new File([csv],"expenses.csv",{type:"text/csv"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(tsv);say("جدول کپی شد؛ در Excel یا Numbers پیست کنید.")}catch(e){await ask("این متن را کپی کنید:",tsv)}};
const SEC=[["kl","🛒 کالابرگ"],["gl","🎯 هدف"],["qk","⚡ ثبت سریع"],["ch","📊 نمودار"]];
const UI=(()=>{try{return JSON.parse(localStorage.getItem("ui"))||{}}catch(e){return{}}})();
function applyUI(){const R=document.documentElement;R.dataset.t=UI.t||"lux";UI.ac?R.style.setProperty("--ac",UI.ac):R.style.removeProperty("--ac");$("#ttl").textContent=UI.ti||"💰 خرج‌های خانواده";$("#tiles").classList.toggle("c3",UI.c===3);SEC.forEach(([id])=>$("#"+id).classList.toggle("off",(UI.h||[]).includes(id)))}
function drawSet(){[...$("#sth").children].forEach(b=>b.classList.toggle("p",b.dataset.th===(UI.t||"lux")));[...$("#scl").children].forEach(b=>b.classList.toggle("p",+b.dataset.c===(UI.c||2)));$("#ssec").innerHTML=SEC.map(([id,n])=>`<div class="chip" data-sc="${id}" style="${(UI.h||[]).includes(id)?"opacity:.4":"background:var(--ac);color:#fff"}">${n}</div>`).join("")}
$("#gear").onclick=()=>{$("#sti").value=UI.ti||"";$("#sac").value=UI.ac||"#d19a52";drawSet();$("#set").hidden=false};
$("#sac").oninput=e=>{UI.ac=e.target.value;cache("ui",UI);applyUI()};
$("#set").onclick=e=>{const c=s=>e.target.closest(s);let x;
  if(x=c("[data-th]")){UI.t=x.dataset.th;delete UI.ac}
  else if(x=c("[data-c]"))UI.c=+x.dataset.c;
  else if(x=c("[data-sc]")){const h=UI.h||[],id=x.dataset.sc;UI.h=h.includes(id)?h.filter(v=>v!==id):[...h,id]}
  else if(c("#sacr"))delete UI.ac;
  else if(c("#sok")||e.target.id==="set"){UI.ti=$("#sti").value.trim();cache("ui",UI);applyUI();$("#set").hidden=true;return}
  else return;
  cache("ui",UI);applyUI();drawSet()};
applyUI();init();
</script>
</body>
</html>
